<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A modern, sleek, and intuitive To-Do application with priority tagging, due date tracking, filters, search, and dark/light mode."
    />
    <title>TaskFlow — Smart To-Do App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Top Navigation / Header -->
      <header class="app-header">
        <div class="header-brand">
          <div class="brand-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              ></path>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">TaskFlow</h1>
            <p class="brand-subtitle">Organize your daily tasks effortlessly</p>
          </div>
        </div>

        <div class="header-actions">
          <button
            id="theme-toggle-btn"
            class="icon-btn"
            title="Toggle Theme"
            aria-label="Toggle theme"
          >
            <span class="theme-icon sun-icon">☀️</span>
            <span class="theme-icon moon-icon">🌙</span>
          </button>
          <button id="open-add-modal-btn" class="btn btn-primary">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Task</span>
          </button>
        </div>
      </header>

      <!-- Progress & Overview Stats Card -->
      <section class="stats-section">
        <div class="stats-card">
          <div class="stats-header">
            <div>
              <h2 class="stats-title">Today's Progress</h2>
              <span id="stats-summary" class="stats-summary"
                >0 of 0 tasks completed</span
              >
            </div>
            <span id="stats-percentage" class="stats-percentage">0%</span>
          </div>
          <div class="progress-bar-track">
            <div
              id="progress-bar-fill"
              class="progress-bar-fill"
              style="width: 0%"
            ></div>
          </div>
          <div class="stats-badges">
            <div class="stat-pill">
              <span class="stat-num" id="stat-all-count">0</span> Total
            </div>
            <div class="stat-pill stat-pill-active">
              <span class="stat-num" id="stat-active-count">0</span> Active
            </div>
            <div class="stat-pill stat-pill-done">
              <span class="stat-num" id="stat-done-count">0</span> Done
            </div>
          </div>
        </div>
      </section>

      <!-- Quick Add Bar -->
      <section class="quick-add-section">
        <form id="quick-add-form" class="quick-add-form">
          <div class="quick-input-wrapper">
            <svg
              class="quick-add-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            <input
              type="text"
              id="quick-task-input"
              placeholder="Quickly add a task and press Enter..."
              autocomplete="off"
            />
          </div>
          <button type="submit" class="btn btn-secondary">Add</button>
        </form>
      </section>

      <!-- Search & Filter Controls -->
      <section class="controls-section">
        <div class="search-box">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Search tasks by title or notes..."
            autocomplete="off"
          />
          <button
            id="clear-search-btn"
            class="clear-btn"
            title="Clear search"
            style="display: none"
          >
            ×
          </button>
        </div>

        <div class="filters-row">
          <!-- Status Filter Pills -->
          <div class="filter-pills" id="status-filters">
            <button class="pill-btn active" data-status="all">All</button>
            <button class="pill-btn" data-status="active">Active</button>
            <button class="pill-btn" data-status="completed">Completed</button>
          </div>

          <!-- Priority & Category Selects -->
          <div class="select-filters">
            <select
              id="priority-filter"
              class="filter-select"
              aria-label="Filter by priority"
            >
              <option value="all">All Priorities</option>
              <option value="high">🔥 High</option>
              <option value="medium">⚡ Medium</option>
              <option value="low">🌱 Low</option>
            </select>

            <select
              id="category-filter"
              class="filter-select"
              aria-label="Filter by category"
            >
              <option value="all">All Categories</option>
              <option value="work">💼 Work</option>
              <option value="personal">👤 Personal</option>
              <option value="study">📚 Study</option>
              <option value="general">✨ General</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Tasks List Container -->
      <main class="tasks-container">
        <div class="tasks-list-header">
          <h3 id="current-view-title" class="current-view-title">All Tasks</h3>
          <button
            id="clear-completed-btn"
            class="btn-text"
            title="Clear all completed tasks"
            style="display: none"
          >
            Clear Completed
          </button>
        </div>

        <ul id="task-list" class="task-list" aria-live="polite">
          <!-- Injected via JavaScript -->
        </ul>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display: none">
          <div class="empty-icon">📝</div>
          <h4 class="empty-title">No tasks found</h4>
          <p class="empty-desc">
            You're all caught up, or your filters don't match any tasks.
          </p>
          <button
            id="empty-add-btn"
            class="btn btn-primary"
            style="margin-top: 12px"
          >
            Create a Task
          </button>
        </div>
      </main>
    </div>

    <!-- Task Create / Edit Modal -->
    <div
      id="task-modal"
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modal-title">Add New Task</h2>
          <button
            id="modal-close-btn"
            class="modal-close"
            aria-label="Close modal"
          >
            ×
          </button>
        </div>

        <form id="task-form" class="modal-body">
          <input type="hidden" id="edit-task-id" value="" />

          <div class="form-group">
            <label for="task-title"
              >Title <span class="required">*</span></label
            >
            <input
              type="text"
              id="task-title"
              placeholder="e.g., Complete project report"
              required
              autofocus
            />
          </div>

          <div class="form-group">
            <label for="task-desc">Description / Notes</label>
            <textarea
              id="task-desc"
              rows="3"
              placeholder="Add extra details, checklist items, or links..."
            ></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="task-priority">Priority</label>
              <select id="task-priority">
                <option value="low">🌱 Low</option>
                <option value="medium" selected>⚡ Medium</option>
                <option value="high">🔥 High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="task-category">Category</label>
              <select id="task-category">
                <option value="general" selected>✨ General</option>
                <option value="work">💼 Work</option>
                <option value="personal">👤 Personal</option>
                <option value="study">📚 Study</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date" />
          </div>

          <div class="modal-actions">
            <button type="button" id="modal-cancel-btn" class="btn btn-outline">
              Cancel
            </button>
            <button type="submit" id="modal-submit-btn" class="btn btn-primary">
              Save Task
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Feedback Container -->
    <div
      id="toast-container"
      class="toast-container"
      aria-live="assertive"
    ></div>

    <script src="script.js"></script>
  </body>
</html>
